# Production stack for the VPS (safe/incremental — used by the auto-deploy).
#
# This file keeps the backend published on :3000 and does NOT require new env
# vars, so `docker compose ... up -d --no-deps backend` never breaks.
# Only non-breaking hardening is applied here: log rotation + Redis AOF.
#
# For the FULL hardening (Caddy auto-HTTPS, backend internal-only, Redis auth,
# mandatory Postgres/Redis passwords) see docker-compose.vps.hardened.yml and
# roll it out in a planned maintenance window with DNS + env configured.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3000:3000"
    env_file: apps/backend/.env.vps
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads:/app/apps/backend/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agendabot
      POSTGRES_USER: agendabot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agendabot_prod_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendabot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  # Backup diário do Postgres (pg_dump -Fc + gzip + rotação de 14 dias).
  # Roda uma vez logo após subir e depois a cada BACKUP_INTERVAL segundos.
  # Uma execução com falha NÃO derruba o serviço — o loop continua e tenta
  # de novo no próximo ciclo. Restauração: ver infra/BACKUP.md.
  db-backup:
    image: postgres:16-alpine
    command:
      - sh
      - -c
      - |
        while true; do
          sh /usr/local/bin/db-backup.sh || echo "[db-backup] execucao falhou (exit $$?) — nova tentativa no proximo ciclo"
          sleep "$${BACKUP_INTERVAL:-86400}"
        done
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: agendabot
      PGDATABASE: agendabot
      PGPASSWORD: ${POSTGRES_PASSWORD:-agendabot_prod_pass}
      BACKUP_DIR: /backups
      BACKUP_KEEP: "14"
      BACKUP_INTERVAL: "86400"
      # Offsite opcional (deixe vazio para manter só o backup local):
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-agendabot-db}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
    volumes:
      - ./infra/backup.sh:/usr/local/bin/db-backup.sh:ro
      - pg_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  uploads:
  pg_backups:
